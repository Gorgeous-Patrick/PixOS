creation_rules:
  # Dedicated home-vpn secret. Keep this above the generic rule.
  - path_regex: secrets/home-vpn\.yaml$
    key_groups:
      - age:
          - *framework
          - *macos
          - *backup
          # Uncomment after adding the public recipient above:
          # - *home_vpn

  # Do not add home_vpn to this generic rule!
  - path_regex: secrets/.*\.ya?ml$
    key_groups:
      - age:
          - *framework
          - *macos
          - *backup
