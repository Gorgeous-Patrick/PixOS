name: Build and cache

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          # Attic's store snapshot parser requires Nix's JSON format 2.
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install Attic client
        if: github.event_name == 'push'
        run: |
          nix --version
          nix build --inputs-from . nixpkgs#attic-client --out-link "$RUNNER_TEMP/attic-client"
          echo "$RUNNER_TEMP/attic-client/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/attic-client/bin/attic" --version
      - name: Set up Attic cache
        # Only trusted pushes receive the cache upload token.
        if: github.event_name == 'push'
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://cache.patrickli.one
          cache: pixos
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
      - run: nix build .#nixosConfigurations.framework.config.system.build.toplevel

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install Attic client
        if: github.event_name == 'push'
        run: |
          nix --version
          nix build --inputs-from . nixpkgs#attic-client --out-link "$RUNNER_TEMP/attic-client"
          echo "$RUNNER_TEMP/attic-client/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/attic-client/bin/attic" --version
      - name: Set up Attic cache
        if: github.event_name == 'push'
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://cache.patrickli.one
          cache: pixos
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
      - run: nix build .#darwinConfigurations.macos.system
